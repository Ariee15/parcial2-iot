<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="titulo-foto desc-foto">
  <title id="titulo-foto">Foto del creador (imagen de reemplazo)</title>
  <desc id="desc-foto">Ilustración de un avatar con la leyenda Tu foto aquí, que debe sustituirse por la fotografía real del estudiante.</desc>
  <defs>
    <linearGradient id="fondo-foto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13203a"/>
      <stop offset="100%" stop-color="#1a1440"/>
    </linearGradient>
    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#2a3550" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="480" rx="24" fill="url(#fondo-foto)"/>
  <rect width="480" height="480" rx="24" fill="url(#rejilla)" opacity="0.5"/>
  <rect x="14" y="14" width="452" height="452" rx="16" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 10"/>

  <circle cx="240" cy="196" r="72" fill="#22304d" stroke="#7c5cff" stroke-width="4"/>
  <path d="M112 400 a128 118 0 0 1 256 0" fill="#22304d" stroke="#7c5cff" stroke-width="4"/>
  <circle cx="300" cy="140" r="26" fill="#39ff88"/>
  <path d="M290 140 l7 8 14 -16" fill="none" stroke="#0d1526" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="240" y="446" fill="#8b93a7" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle">[ Tu foto aquí ]</text>
</svg>
